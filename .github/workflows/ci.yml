name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test & build
    # Pinned: MongoDB never became ready on ubuntu-latest (Ubuntu 26).
    runs-on: ubuntu-24.04
    env:
      TEST_MONGODB_URI: mongodb://localhost:27117
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      # Real MongoDB for the API tests, on the same major version as production (Atlas 8.0).
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27117:27017 mongo:8.0
          for _ in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              echo "MongoDB is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs mongo
          # An annotation shows on the run's summary, without opening the logs.
          state=$(docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' mongo)
          echo "::error::MongoDB not ready: $state $(docker logs mongo 2>&1 | tail -n 3 | tr -d '\n' | cut -c1-500)"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: apps/api/Dockerfile
            app: ''
          - image: web
            file: docker/spa.Dockerfile
            app: web
          - image: admin
            file: docker/spa.Dockerfile
            app: admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.app && format('APP={0}', matrix.app) || '' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
