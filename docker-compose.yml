# Production-like stack on your machine, built from source (with a local MongoDB):
#   docker compose up --build
# Website: http://localhost:8180   Admin: http://localhost:8181   Meetings: http://localhost:8183
# For `npm run dev` instead, start just the media server for meetings: docker compose up -d livekit redis
# Create the first owner:
#   docker compose exec api node dist/create-owner.js --email you@example.com

services:
  mongo:
    image: mongo:8
    # Reachable only from this machine, e.g. MONGODB_URI=mongodb://localhost:27018 for `npm run dev`.
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: muvance
      TRUST_PROXY: 'true'
      # Plain HTTP locally, so the session cookie can't be HTTPS-only.
      COOKIE_SECURE: 'false'
      ADMIN_URL: http://localhost:8181
      CORS_ORIGIN: http://localhost:8180,http://localhost:8181,http://localhost:8183
      MEET_URL: http://localhost:8183
      LIVEKIT_URL: http://livekit:7880
      # Local-only values; production's are made by deploy.sh on the server.
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: muvance-local-livekit-secret-0123456789
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: web
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: admin
    restart: unless-stopped

  meet:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: meet
    restart: unless-stopped

  mailweb:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: mail
    restart: unless-stopped

  chat:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: chat
    restart: unless-stopped

  accounts:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: accounts
    restart: unless-stopped

  # Media server for meetings. Also used by `npm run dev` (the API's defaults match these keys).
  livekit:
    image: livekit/livekit-server:v1.13.11
    # On this machine browsers reach it at 127.0.0.1.
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    environment:
      LIVEKIT_KEYS: 'devkey: muvance-local-livekit-secret-0123456789'
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881/tcp'
      - '127.0.0.1:7882:7882/udp'
    depends_on:
      - redis
    restart: unless-stopped

  # LiveKit needs it (it's how it would talk to a recorder). Call recording itself only runs in
  # production: the recorder needs Linux host networking.
  redis:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: http://localhost:8180
      ADMIN_ADDRESS: http://localhost:8181
      WWW_ADDRESS: http://localhost:8182
      MEET_ADDRESS: http://localhost:8183
      # Muvance Mail's app runs locally too; the mail server itself only in production.
      MAIL_ADDRESS: http://localhost:8184
      CHAT_ADDRESS: http://localhost:8185
      ACCOUNTS_ADDRESS: http://localhost:8186
      SITE_URL: http://localhost:8180
    ports:
      - '8180:8180'
      - '8181:8181'
      - '8183:8183'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      meet:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
