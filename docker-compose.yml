# Production-like stack on your machine, built from source (with a local MongoDB):
#   docker compose up --build
# Website: http://localhost:8180   Admin: http://localhost:8181
# Create the first owner:
#   docker compose exec api node dist/create-owner.js --email you@example.com

services:
  mongo:
    image: mongo:8
    # Reachable only from this machine, e.g. MONGODB_URI=mongodb://localhost:27018 for `npm run dev`.
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: muvance
      TRUST_PROXY: 'true'
      # Plain HTTP locally, so the session cookie can't be HTTPS-only.
      COOKIE_SECURE: 'false'
      ADMIN_URL: http://localhost:8181
      CORS_ORIGIN: http://localhost:8180,http://localhost:8181
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: web
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: admin
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: http://localhost:8180
      ADMIN_ADDRESS: http://localhost:8181
      WWW_ADDRESS: http://localhost:8182
      SITE_URL: http://localhost:8180
    ports:
      - '8180:8180'
      - '8181:8181'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
