# Production stack (runs on the VPS). Images are built by GitHub Actions and pulled from GHCR.
# MongoDB is external (MongoDB Atlas). See DEPLOY.md.
# Muvance has this server to itself: Caddy owns ports 80/443 and gets HTTPS certificates for every
# domain automatically. LiveKit (meetings) also publishes its media ports. Nothing else is public.
#   IMAGE_TAG=sha-<commit> docker compose --env-file .env.production -f compose.production.yml up -d --wait

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      # Plain domain names: Caddy gets and renews their HTTPS certificates itself.
      SITE_ADDRESS: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      ADMIN_ADDRESS: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env.production}
      WWW_ADDRESS: www.${SITE_DOMAIN}
      MEET_ADDRESS: meet.${SITE_DOMAIN}
      MAIL_ADDRESS: mail.${SITE_DOMAIN}
      CHAT_ADDRESS: chat.${SITE_DOMAIN}
      ACCOUNTS_ADDRESS: accounts.${SITE_DOMAIN}
      SITE_URL: https://${SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates. Kept between deploys, so Caddy doesn't ask for new ones every time.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      meet:
        condition: service_healthy
      mailweb:
        condition: service_healthy
      chat:
        condition: service_healthy
      accounts:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env.production}/muvance-api:${IMAGE_TAG:-prod}
    env_file:
      - ${API_ENV_FILE:-./runtime/api.env}
      # LiveKit's key and secret, created by deploy.sh the first time.
      - ./runtime/livekit.env
      # Muvance Mail's session encryption key, also made by deploy.sh.
      - ./runtime/webmail.env
      # The outgoing relay's login (copied from runtime/mail.env by deploy.sh), for clients'
      # sign-in codes in Muvance Chat.
      - ./runtime/relay.env
      # GOOGLE_CLIENT_ID for "Continue with Google" in Muvance Chat (written by the release).
      - ./runtime/google.env
    environment:
      NODE_ENV: production
      PORT: '4000'
      # One proxy in front: Caddy.
      TRUST_PROXY: '1'
      COOKIE_SECURE: 'true'
      # One Muvance account sign-in for every app on the domain (admin., mail., chat., meet., accounts.).
      COOKIE_DOMAIN: ${SITE_DOMAIN}
      ACCOUNTS_URL: https://accounts.${SITE_DOMAIN}
      ADMIN_URL: https://${ADMIN_DOMAIN}
      SITE_URL: https://${SITE_DOMAIN}
      MEET_URL: https://meet.${SITE_DOMAIN}
      CHAT_URL: https://chat.${SITE_DOMAIN}
      # Files shared in chat.
      CHAT_FILES_DIR: /chat-files
      LIVEKIT_URL: http://livekit:7880
      # Call recordings: the recorder writes to /out, the API reads the same folder here.
      CALL_RECORDINGS_DIR: /recordings
      EGRESS_OUTPUT_DIR: /out
      CORS_ORIGIN: https://${SITE_DOMAIN},https://${ADMIN_DOMAIN},https://meet.${SITE_DOMAIN},https://chat.${SITE_DOMAIN},https://accounts.${SITE_DOMAIN}
      # Team email: the API writes the mail server's accounts files here.
      MAIL_DOMAIN: ${SITE_DOMAIN}
      MAIL_HOST: mail.${SITE_DOMAIN}
      MAIL_CONFIG_DIR: /mail-config
    volumes:
      - ./call-recordings:/recordings
      - ./mail/config:/mail-config
      - ./chat-files:/chat-files
    restart: unless-stopped
    logging: *logging

  web:
    image: ${IMAGE_PREFIX}/muvance-web:${IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging

  admin:
    image: ${IMAGE_PREFIX}/muvance-admin:${IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging

  # Video meetings (meet.<site domain>).
  meet:
    image: ${IMAGE_PREFIX}/muvance-meet:${IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging

  # Muvance Mail, the webmail app (mail.<site domain>). Reads and sends through the API.
  mailweb:
    image: ${IMAGE_PREFIX}/muvance-mail:${IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging

  # Muvance Chat, the team and client chat app (chat.<site domain>). Talks only to the API.
  chat:
    image: ${IMAGE_PREFIX}/muvance-chat:${IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging

  # Muvance Account (accounts.<site domain>): sign-in, password and apps for every Muvance account.
  accounts:
    image: ${IMAGE_PREFIX}/muvance-accounts:${IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging

  # LiveKit, the media server for meetings. Signalling goes through Caddy (/rtc); audio and video
  # go straight to these two published ports, which must be open in the firewall (see DEPLOY.md).
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    env_file:
      - ./runtime/livekit.env
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7881:7881/tcp'
      - '7882:7882/udp'
      # Only for the recorder on this machine; not reachable from the internet.
      - '127.0.0.1:7880:7880'
    depends_on:
      - redis
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7880']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

  # Connects LiveKit and the recorder. Holds nothing that needs keeping.
  redis:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

  # Records calls (LiveKit Egress): a hidden Chrome joins the call and saves it as an MP4 in
  # ./call-recordings. Uses the host's network so it reaches LiveKit's media ports directly.
  egress:
    image: livekit/egress:v1.15.0
    network_mode: host
    cap_add:
      - SYS_ADMIN
    shm_size: '1gb'
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      # Made by deploy.sh from runtime/livekit.env (it holds LiveKit's key).
      - ./runtime/egress.yaml:/etc/egress.yaml:ro
      - ./call-recordings:/out
    depends_on:
      - livekit
      - redis
    restart: unless-stopped
    logging: *logging

  # --- Team email server. Only started once it's set up (deploy.sh adds the "mail" profile when
  # runtime/mail.env, the mail.<domain> certificate and at least one mailbox exist).

  # docker-mailserver: receives mail for @<domain>, stores it, and sends through the relay (Brevo).
  mailserver:
    image: mailserver/docker-mailserver:16.0.1
    profiles: [mail]
    hostname: mail.${SITE_DOMAIN}
    env_file:
      # RELAY_USER and RELAY_PASSWORD for the outgoing relay. Kept only on the server.
      - ./runtime/mail.env
    environment:
      DEFAULT_RELAY_HOST: '[smtp-relay.brevo.com]:587'
      POSTMASTER_ADDRESS: postmaster@${SITE_DOMAIN}
      SSL_TYPE: manual
      # Caddy's certificate for mail.<domain> (it renews it; the mail server notices).
      SSL_CERT_PATH: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${SITE_DOMAIN}/mail.${SITE_DOMAIN}.crt
      SSL_KEY_PATH: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${SITE_DOMAIN}/mail.${SITE_DOMAIN}.key
      ENABLE_RSPAMD: '1'
      RSPAMD_LEARN: '1'
      RSPAMD_GREYLISTING: '0'
      MOVE_SPAM_TO_JUNK: '1'
      ENABLE_OPENDKIM: '0'
      ENABLE_OPENDMARC: '0'
      ENABLE_POLICYD_SPF: '0'
      ENABLE_AMAVIS: '0'
      ENABLE_SPAMASSASSIN: '0'
      ENABLE_CLAMAV: '0'
      ENABLE_POSTGREY: '0'
      ENABLE_FAIL2BAN: '1'
      ENABLE_MANAGESIEVE: '1'
      ENABLE_QUOTAS: '1'
      ENABLE_POP3: '0'
      ENABLE_UPDATE_CHECK: '0'
      SPOOF_PROTECTION: '1'
      PERMIT_DOCKER: none
      ONE_DIR: '1'
      POSTFIX_MESSAGE_SIZE_LIMIT: '31457280'
      TZ: Asia/Dhaka
    ports:
      - '25:25' # receiving mail from other servers
      - '465:465' # sending from mail apps (SSL/TLS)
      - '587:587' # sending from mail apps (STARTTLS)
      - '993:993' # reading mail in mail apps (IMAP, SSL/TLS)
    volumes:
      - ./mail/data:/var/mail
      - ./mail/state:/var/mail-state
      - ./mail/logs:/var/log/mail
      - ./mail/config:/tmp/docker-mailserver
      - caddy_data:/caddy-data:ro
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN # fail2ban
    networks:
      default:
        # The API reaches it by its public name, so the TLS certificate matches.
        aliases:
          - mail.${SITE_DOMAIN}
    stop_grace_period: 1m
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
