# Production stack (runs on the VPS). Images are built by GitHub Actions and pulled from GHCR.
# MongoDB is external (MongoDB Atlas). See DEPLOY.md.
# Muvance has this server to itself: Caddy owns ports 80/443 and gets HTTPS certificates for every
# domain automatically. LiveKit (meetings) also publishes its media ports. Nothing else is public.
#   IMAGE_TAG=sha-<commit> docker compose --env-file .env.production -f compose.production.yml up -d --wait

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      # Plain domain names: Caddy gets and renews their HTTPS certificates itself.
      SITE_ADDRESS: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      ADMIN_ADDRESS: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env.production}
      WWW_ADDRESS: www.${SITE_DOMAIN}
      MEET_ADDRESS: meet.${SITE_DOMAIN}
      SITE_URL: https://${SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates. Kept between deploys, so Caddy doesn't ask for new ones every time.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      meet:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env.production}/muvance-api:${IMAGE_TAG:-prod}
    env_file:
      - ${API_ENV_FILE:-./runtime/api.env}
      # LiveKit's key and secret, created by deploy.sh the first time.
      - ./runtime/livekit.env
    environment:
      NODE_ENV: production
      PORT: '4000'
      # One proxy in front: Caddy.
      TRUST_PROXY: '1'
      COOKIE_SECURE: 'true'
      ADMIN_URL: https://${ADMIN_DOMAIN}
      SITE_URL: https://${SITE_DOMAIN}
      MEET_URL: https://meet.${SITE_DOMAIN}
      LIVEKIT_URL: http://livekit:7880
      # Call recordings: the recorder writes to /out, the API reads the same folder here.
      CALL_RECORDINGS_DIR: /recordings
      EGRESS_OUTPUT_DIR: /out
      CORS_ORIGIN: https://${SITE_DOMAIN},https://${ADMIN_DOMAIN},https://meet.${SITE_DOMAIN}
    volumes:
      - ./call-recordings:/recordings
    restart: unless-stopped
    logging: *logging

  web:
    image: ${IMAGE_PREFIX}/muvance-web:${IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging

  admin:
    image: ${IMAGE_PREFIX}/muvance-admin:${IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging

  # Video meetings (meet.<site domain>).
  meet:
    image: ${IMAGE_PREFIX}/muvance-meet:${IMAGE_TAG:-prod}
    restart: unless-stopped
    logging: *logging

  # LiveKit, the media server for meetings. Signalling goes through Caddy (/rtc); audio and video
  # go straight to these two published ports, which must be open in the firewall (see DEPLOY.md).
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    env_file:
      - ./runtime/livekit.env
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7881:7881/tcp'
      - '7882:7882/udp'
      # Only for the recorder on this machine; not reachable from the internet.
      - '127.0.0.1:7880:7880'
    depends_on:
      - redis
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7880']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

  # Connects LiveKit and the recorder. Holds nothing that needs keeping.
  redis:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

  # Records calls (LiveKit Egress): a hidden Chrome joins the call and saves it as an MP4 in
  # ./call-recordings. Uses the host's network so it reaches LiveKit's media ports directly.
  egress:
    image: livekit/egress:v1.15.0
    network_mode: host
    cap_add:
      - SYS_ADMIN
    shm_size: '1gb'
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      # Made by deploy.sh from runtime/livekit.env (it holds LiveKit's key).
      - ./runtime/egress.yaml:/etc/egress.yaml:ro
      - ./call-recordings:/out
    depends_on:
      - livekit
      - redis
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
